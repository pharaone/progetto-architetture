<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Service - Frontend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Menu Service</h1>
            <nav id="main-nav" style="display: none;">
                <button class="nav-btn active" data-section="menu">Menu</button>
                <button class="nav-btn" data-section="orders">I Miei Ordini</button>
                <button class="nav-btn" data-section="admin">Admin</button>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </nav>
            <div id="user-info" style="display: none;">
                <span id="user-email"></span>
            </div>
        </header>

        <main>
            <!-- Login/Register Section -->
            <section id="auth-section" class="section active">
                <div class="auth-container">
                    <div class="auth-card">
                        <h2>Accedi al Menu Service</h2>
                        <div class="auth-tabs">
                            <button class="auth-tab active" data-tab="login">Login</button>
                            <button class="auth-tab" data-tab="register">Registrati</button>
                        </div>
                        
                        <!-- Login Form -->
                        <div id="login-tab" class="auth-tab-content active">
                            <form id="login-form">
                                <input type="email" id="login-email" placeholder="Email" required>
                                <input type="password" id="login-password" placeholder="Password" required>
                                <button type="submit" class="btn btn-primary">Accedi</button>
                            </form>
                        </div>
                        
                        <!-- Register Form -->
                        <div id="register-tab" class="auth-tab-content">
                            <form id="register-form">
                                <input type="email" id="register-email" placeholder="Email" required>
                                <input type="password" id="register-password" placeholder="Password" required>
                                <input type="text" id="register-region" placeholder="Regione" required>
                                <button type="submit" class="btn btn-primary">Registrati</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Menu Section -->
            <section id="menu-section" class="section">
                <div class="section-header">
                    <h2>Menu Disponibile</h2>
                </div>
                
                <div class="menu-grid" id="menu-grid">
                    <!-- Menu items will be loaded here -->
                </div>
            </section>

            <!-- Orders Section -->
            <section id="orders-section" class="section">
                <div class="section-header">
                    <h2>I Miei Ordini</h2>
                    <button id="load-orders-btn" class="btn btn-primary">
                        <span style="margin-right: 8px;">🔄</span>
                        Aggiorna Ordini
                    </button>
                </div>

                <div id="orders-results" class="results-container">
                    <!-- Order results will be displayed here -->
                </div>
            </section>

            <!-- Admin Section -->
            <section id="admin-section" class="section">
                <div class="section-header">
                    <h2>Gestione Admin</h2>
                    <button id="add-dish-btn" class="btn btn-primary">Aggiungi Piatto</button>
                </div>
                
                <div class="admin-forms">
                    <div class="form-card">
                        <h3>Conferma Utente</h3>
                        <form id="confirm-form">
                            <input type="email" id="confirm-email" placeholder="Email" required>
                            <input type="password" id="confirm-password" placeholder="Password" required>
                            <button type="submit" class="btn btn-primary">Conferma</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal for adding new dish -->
        <div id="dish-modal" class="modal">
            <div class="modal-content modern-modal">
                <div class="modal-header">
                    <h2>
                        <span class="modal-icon">🍽️</span>
                        Aggiungi Nuovo Piatto
                    </h2>
                    <span class="close">&times;</span>
                </div>
                
                <form id="dish-form" class="modern-form">
                    <div class="form-group">
                        <label for="dish-name">
                            <span class="label-icon">📝</span>
                            Nome Piatto
                        </label>
                        <input type="text" id="dish-name" placeholder="Es: Spaghetti Carbonara" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="dish-price">
                            <span class="label-icon">💰</span>
                            Prezzo
                        </label>
                        <div class="price-input-wrapper">
                            <span class="currency-symbol">€</span>
                            <input type="number" id="dish-price" placeholder="12.50" step="0.01" min="0" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="dish-description">
                            <span class="label-icon">📄</span>
                            Descrizione
                        </label>
                        <textarea id="dish-description" placeholder="Descrivi il piatto, ingredienti principali..." rows="4" required></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="hideDishModal()">Annulla</button>
                        <button type="submit" class="btn btn-primary">
                            <span style="margin-right: 8px;">✨</span>
                            Aggiungi Piatto
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notification area -->
        <div id="notification" class="notification"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
